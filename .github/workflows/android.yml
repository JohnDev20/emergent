name: APK de teste
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle assembleDebug
      - run: cp build/outputs/apk/debug/*.apk Casa-em-Dia.apk
      - uses: actions/upload-artifact@v4
        with: {name: Casa-em-Dia, path: Casa-em-Dia.apk}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "teste-${GITHUB_RUN_NUMBER}" Casa-em-Dia.apk --title "Casa em Dia · teste ${GITHUB_RUN_NUMBER}" --notes "APK Android para avaliação."
